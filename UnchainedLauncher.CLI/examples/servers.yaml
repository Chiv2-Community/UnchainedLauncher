# Run: UnchainedLauncher.CLI.exe server --config-path servers.yaml
# Paths resolve relative to this file. Servers share these selections, not active files.
# Requires UnchainedPlugin support for --additional-pak-dir.
# Active paks/plugins: %LOCALAPPDATA%/Chivalry 2/Saved_<suffix>/unchained/.
# Pak bytes are shared through the common content-addressed cache and hard links.
chiv2-path: 'C:\Games\Chivalry 2'
platform: Steam
saved-dir-suffix: MyHost # Default profiles: MyHost-courtyard and MyHost-arena.
server-browser-backend: https://servers.polehammer.net
update-plugin: true
allow-unstable-plugin: false
no-tui: false
game-args: []
mod-setup:
  registries: [] # Official registry is included automatically.
  mods: []
  dlls: []

servers:
  courtyard:
    name: Courtyard FFA
    map: FFA_Courtyard
    game-port: 7777
    ping-port: 3075
    query-port: 7071
    rcon-port: 9001
    mod-actors: []
  arena:
    name: Arena FFA
    map: FFA_Courtyard # Replace with an installed map's travel name.
    saved-dir-suffix: ArenaProfile # Optional explicit per-server profile.
    game-port: 7778
    ping-port: 3076
    query-port: 7072
    rcon-port: 9002
    mod-actors: []
