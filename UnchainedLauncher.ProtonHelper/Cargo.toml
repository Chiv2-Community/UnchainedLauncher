[package]
name = "unchained-proton-helper"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = [
    "Win32_Foundation", "Win32_Security", "Win32_System_Com",
    "Win32_System_Console", "Win32_System_Diagnostics_Debug",
    "Win32_System_JobObjects", "Win32_System_LibraryLoader",
    "Win32_System_Memory", "Win32_System_Pipes", "Win32_System_Threading",
    "Win32_UI_Shell",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
