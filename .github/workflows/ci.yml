name:  Unchained Launcher CI Tests

on:
  push:
    branches:
        - 'main'
  pull_request:
    branches:
        - 'main'
        - 'series/*'
        - 'feature/dll-validation'

env:
  DOTNET_VERSION: '10.x'

# TODO: Run integration tests. Set up some kind of stubbed environment for the tests to run in.
jobs:
  cli-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    - name: Test native CLI
      run: dotnet test UnchainedLauncher.CLI.Tests -c Release
    - name: Publish native CLI and Windows Proton helper
      run: dotnet publish UnchainedLauncher.CLI -c Release -r linux-x64 --self-contained true -o out-cli-linux
    - name: Archive Linux CLI with executable permissions
      run: tar -czf UnchainedLauncher-CLI-linux-x64.tar.gz -C out-cli-linux .
    - uses: actions/upload-artifact@v4
      with:
        name: UnchainedLauncher_CLI_linux-x64_${{ github.sha }}
        path: UnchainedLauncher-CLI-linux-x64.tar.gz
  build:
    strategy:
      matrix:
        configuration: [Debug, Release]
    runs-on: windows-latest
    env:
      GUI_Project_Path: UnchainedLauncher.GUI
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.AUTOMATED_CODE_CHANGE }}

    - name: Setup dotnet
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}


    - name: Format source
      run: dotnet format
    - uses: stefanzweifel/git-auto-commit-action@v7
      id: auto-commit-action
      with:
        commit_message: '[GHA] Format Source'
        token: ${{ secrets.AUTOMATED_CODE_CHANGE }}


    - name: Fail if changes were detected
      if: steps.auto-commit-action.outputs.changes_detected == 'true'
      run: exit 1

    - name: Install dependencies
      run: dotnet restore
      
    - name: Build
      run: dotnet build -c ${{ matrix.configuration }}
    - name: Run Unit Tests
      run: dotnet test -c ${{ matrix.configuration }} .\UnchainedLauncher.Core.Tests.Unit --logger:"console;verbosity=detailed"

    - name: Run Scanner Configuration Tests
      run: dotnet test -c ${{ matrix.configuration }} .\UnchainedLauncher.PakScannerApp.Tests --logger:"console;verbosity=detailed"

    - name: Run CLI Tests
      run: dotnet test -c ${{ matrix.configuration }} .\UnchainedLauncher.CLI.Tests --logger:"console;verbosity=detailed"

    - name: Run Plugin Manager Tests
      run: dotnet test -c ${{ matrix.configuration }} .\UnchainedLauncher.GUI.Tests.Unit --logger:"console;verbosity=detailed"

    - name: Package CLI binaries
      run: dotnet publish UnchainedLauncher.CLI -c ${{ matrix.configuration }} -r win-x64 --self-contained true -o out-cli/

    - name: Upload CLI Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: UnchainedLauncher_CLI_${{ matrix.configuration }}_${{ github.sha }}
        path: out-cli

    - name: Package ${{ matrix.configuration }} binaries
      run: dotnet publish UnchainedLauncher.GUI -c ${{ matrix.configuration}} -o out/

    - name: Upload ${{ matrix.configuration }} Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: UnchainedLauncher_${{ matrix.configuration }}_${{ github.sha }}
        path: out

  build-pakscanner:
    strategy:
      matrix:
        platform: [Win64, x64]
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup dotnet
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Install dependencies
      run: dotnet restore

    - name: Package PakScannerApp binaries
      run: >
        dotnet publish UnchainedLauncher.PakScannerApp
        -c Release 
        /p:PublishProfile=PakScanner_Release_${{ matrix.platform }} 
        -o out/

    - name: Upload PakScannerApp Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: PakScanner_Release_${{ matrix.platform }}_${{ github.sha }}
        path: out
