# Paths are relative to this file, unless absolute. Change this installation path.
chiv2-path: 'C:\Games\Chivalry 2'
platform: Steam # Steam or EGS; required

# Run with: UnchainedLauncher.CLI.exe server --config-path server.yaml
# Requires UnchainedPlugin support for --additional-pak-dir.
# Replace the core plugin pin with a registered build supporting that option.
# Paks/plugins live in %LOCALAPPDATA%/Chivalry 2/Saved_MyServer/unchained/.
# Pak bytes are shared through the common verified cache and hard links.
# A client block, if included, is ignored by the server command.
server-browser-backend: https://servers.polehammer.net
update-plugin: true
allow-unstable-plugin: false
no-tui: false
game-args: [] # Common game/auth arguments; one YAML string per argument.

server:
  saved-dir-suffix: MyServer
  mod-setup:
    registries: [] # Official GitHub registry is included automatically.
    mods:
      - Chiv2-Community/Unchained-Mods:v0.1.0
      - Chiv2-Community/Chiv2Turbo:v0.0.4
    dlls:
      - Chiv2-Community/UnchainedPlugin:v1.0.0-RC3
  ini:
    Game:
      /Script/TBL.TBLGameMode:
        MapList: [FFA_Courtyard, FFA_Wardenglade]
        BotBackfillEnabled: true
        ClassLimits:
          - Class: Poleman
            ClassLimitPercent: 10
          - Class: Archer
            ClassLimitPercent: 0
  name: My Unchained Server
  description: Example server
  password: ''
  starting-map: FFA_Courtyard
  game-port: 7777
  ping-port: 3075
  query-port: 7071
  rcon-port: 9001
  headless: true # Rendering requires headless: false AND desync-patch: false.
  register: false
  # local-ip: 192.168.1.10 # Optional override; local IPv4 is auto-detected.
  mod-actors:
    - /Game/Mods/AgMods/Chiv2Turbo/Chiv2Turbo.Chiv2Turbo_C
  desync-patch: true # Default true; explicitly set false to disable.
  use-backend-banlist: true # Default true; explicitly set false to disable.
  censor-mode: none # none, standard, sex, zealous
  game-args: [] # Additional server-only arguments, appended after common game-args.
  # ini patches only specified fields in the saved profile; other fields are preserved.
  # Optional Discord integration: token and at least one channel are required.
  # discord:
  #   bot-token: 'replace-with-your-bot-token'
  #   admin-channel-id: '123456789012345678'
  #   general-channel-id: '234567890123456789'
  #   dashboard-channel-id: '345678901234567890'
  #   event-log-channel-id: '456789012345678901'
  #   admin-role-id: '567890123456789012'
  #   mention-admins: true
